<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BioLab Virtual | Sin conexion</title>
    <style>
      :root {
        --bg: #020617;
        --panel: #0f172a;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #22d3ee;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(circle at 20% 20%, #1e293b, var(--bg) 55%);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      section {
        width: min(560px, 100%);
        background: color-mix(in srgb, var(--panel) 85%, black 15%);
        border: 1px solid #1e293b;
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 1.5rem;
      }

      p {
        margin: 0;
        line-height: 1.55;
        color: var(--muted);
      }

      a {
        display: inline-block;
        margin-top: 18px;
        color: #082f49;
        background: var(--accent);
        text-decoration: none;
        padding: 10px 14px;
        border-radius: 10px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Estas sin conexion</h1>
        <p>
          BioLab Virtual no detecta red en este momento. Puedes regresar y continuar
          con contenidos que ya hayas abierto previamente.
        </p>
        <a href="/">Volver al inicio</a>
      </section>
    </main>
  </body>
</html>
